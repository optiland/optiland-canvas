[package]
name = "oc-py"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
# Not the workspace's 1.75: pyo3 0.29 requires 1.83, and 0.29 is the floor that
# clears this crate's security advisories. Declared here rather than raised
# workspace-wide so the engine crates keep their lower promise. Nothing else
# depends on pyo3, and `oc-py` is already outside `default-members`, so a bare
# `cargo build` never asks a 1.75 toolchain to compile this.
rust-version = "1.83"
description = "PyO3 bindings for Optiland Canvas: .ocanvas ⇄ Optiland Optic (M5)."

[lib]
# Compiled into the `optiland_canvas` Python package as the `_native` submodule.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
oc-core = { workspace = true }
serde_json = { workspace = true }

[dependencies.pyo3]
# 0.29 is the floor, not a preference: every PyO3 advisory open against this
# crate is fixed there. GHSA-36hh-v3qg-5jq4 (out-of-bounds read in `nth`/
# `nth_back` for `PyList`/`PyTuple` iterators, high) and GHSA-chgr-c6px-7xpp
# (missing `Sync` bound on `PyCFunction::new_closure`, moderate) are both fixed
# in 0.29.0; GHSA-pph8-gcv7-4qj5 (`PyString::from_object` overflow, low) in
# 0.24.1. Do not float this below 0.29. 0.28.0 and 0.28.1 are yanked.
version = "0.29"
# `extension-module` keeps us from linking libpython (so the wheel is portable);
# `abi3-py39` builds against the stable ABI, one wheel for every CPython ≥ 3.9.
# Both still exist in 0.29, so the wheel story is unchanged.
features = ["extension-module", "abi3-py39"]
