[workspace]
resolver = "2"
members = [
    "crates/oc-core",
    "crates/oc-trace",
    "crates/oc-gpu",
    "crates/oc-fit",
    "crates/oc-openuc2",
    "crates/oc-wasm",
    "crates/oc-py",
]

# `oc-py` (M5) is a PyO3 cdylib built into the `optiland_canvas` Python wheel via
# maturin. It is a workspace *member* but excluded from `default-members`, so a
# bare `cargo test` / `cargo build` stays Python-free and fast; build it
# explicitly with `maturin develop` (see crates/oc-py/README.md) or
# `cargo build -p oc-py`.
default-members = [
    "crates/oc-core",
    "crates/oc-trace",
    "crates/oc-gpu",
    "crates/oc-fit",
    "crates/oc-openuc2",
    "crates/oc-wasm",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/optiland/optiland-canvas"
rust-version = "1.75"

[workspace.dependencies]
oc-core = { path = "crates/oc-core" }
oc-trace = { path = "crates/oc-trace" }
oc-fit = { path = "crates/oc-fit" }
oc-openuc2 = { path = "crates/oc-openuc2" }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` because `.ocanvas` is the contract other tools build on, and
# without it serde_json's parser is best-effort: it can return an f64 one ULP off
# the one that was written. That is not academic. FusedSilica's Sellmeier `c`
# terms are computed (`0.1162414²`), and the value that came back differed from
# the builtin catalogue's — so a fused-silica module could not be placed at all,
# because §10.3 compares a fragment's dispersion against the destination's by
# equality and correctly refused to merge two glasses that really were different.
# The write side was always exact; this makes the read side agree.
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
