name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # oc-py is a PyO3 crate exercised in the `python-bridge` job below; keep it
      # out of the pure-Rust job so this stays Python-free and fast.
      - name: clippy
        run: cargo clippy --workspace --exclude oc-py --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude oc-py

  python-bridge:
    name: python bridge (optiland round-trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clippy (oc-py)
        run: cargo clippy -p oc-py --all-targets -- -D warnings
      - name: build + install (maturin backend) with test deps
        working-directory: crates/oc-py
        run: pip install '.[test]'
      - name: pytest (.ocanvas ⇄ Optiland Optic round-trip)
        working-directory: crates/oc-py
        run: pytest tests -q

  web:
    name: web build (wasm + typecheck + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: build
        working-directory: web
        run: npm run build
      - name: install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      # The openUC2 route driven the way a user drives it (§19.5). Playwright
      # serves the build above; nothing here reaches into the wasm handle.
      - name: browser tests
        working-directory: web
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
