[package]
name = "oc-gpu"
description = "Optiland Canvas interactive tracer: wgpu compute (f32) with a CPU fallback."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["gpu"]
# The wgpu compute backend. Disable for the portable CPU-only build (the
# no-WebGPU fallback / web-worker path, and anything targeting wasm without
# WebGPU wiring).
gpu = ["dep:wgpu", "dep:pollster"]
# The full-3D preview path: f32 CPU (PR 3D-07) and WGSL (PR 3D-08).
#
# Not a newer `gpu`, and not implied by it. `gpu` selects a *backend* (wgpu vs
# the CPU mirror); `gpu3` selects the *dimensionality* of the scene being
# previewed. The four combinations are all meaningful, and `gpu3` without `gpu`
# is the one that matters most: it is the CPU f32 oracle the shader is
# validated against.
#
# Off by default. §12.1 of the contract is explicit that the 2D preview stays
# the default until the 3D path passes both the acceptance suite and the
# performance gate.
gpu3 = ["oc-core/scene3"]

[dependencies]
oc-core.workspace = true
glam.workspace = true
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "22.1", optional = true }
pollster = { version = "0.3", optional = true }

[dev-dependencies]
# `trace3` is enabled so the 3D f32 preview can be cross-validated against the
# f64 reference (the cpu3_vs_f64 suite). It is additive: the 2D cross_validate
# test still uses the default 2D tracer.
oc-trace = { workspace = true, features = ["trace3"] }
serde_json.workspace = true
# The WGSL front end wgpu 22 itself uses (same version), so `shader3_layout`
# can parse and validate the 3D shader, and check its struct layout against
# `buffers3`, on a machine with no usable GPU.
naga = { version = "22.1", features = ["wgsl-in"] }

[[example]]
name = "gpu_probe"
required-features = ["gpu"]

[[example]]
name = "drag"
required-features = ["gpu"]
