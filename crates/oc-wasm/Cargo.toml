[package]
name = "oc-wasm"
description = "Optiland Canvas WASM bindings: scene mutation + interactive trace for the web shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Skip the wasm-opt (binaryen) download+pass: it needs a GitHub release download
# and is only a size optimization. Fine to leave off for dev; flip to a version
# string (e.g. wasm-opt = ["-O"]) for a production bundle.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
# `scene3` turns on the canonical 3D scene model (PR 3D-02+): the browser can now
# hold a `Scene3` alongside the v1 scene and derive the 2D Canvas as a view of it
# (PR 3D-09). The v1 API is untouched; the migration is additive.
oc-core = { path = "../oc-core", features = ["scene3"] }
# The freehand-stroke fitter (M3, §5.3). Pure geometry; wasm-clean.
oc-fit = { path = "../oc-fit" }
# CPU-only interactive backend (no wgpu): the guaranteed-portable path that
# compiles to wasm32 today. The WebGPU backend is enabled in the browser build
# via oc-gpu's `gpu` feature once the WebGPU device is wired to the canvas.
# `gpu3` adds the f32 CPU 3D tracer (`cpu3`) — the interactive picture for the 3D
# preview (§4.1: f32 draws, f64 settles), without pulling in wgpu (that lives
# behind `gpu`, which stays off for wasm).
oc-gpu = { path = "../oc-gpu", default-features = false, features = ["gpu3"] }
# The exact f64 reference tracer, serial (no rayon) so it runs in wasm. Displayed
# metrics come from here, never the f32 interactive path (§4.1). `trace3` adds the
# f64 full-3D reference path (PR 3D-04), the authority behind the 3D preview.
oc-trace = { path = "../oc-trace", default-features = false, features = ["trace3"] }
# The openUC2 adapter (§5.2): catalogue, setup, and placement. oc-core and the
# tracers stay domain-free; everything openUC2-shaped lives behind this.
oc-openuc2 = { path = "../oc-openuc2" }
# Element clipboard: serialize/deserialize a single element for copy/paste.
serde_json = { workspace = true }
wasm-bindgen = "0.2"
