[package]
name = "oc-trace"
description = "Optiland Canvas reference tracer: CPU, f64, exact. The source of truth."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["parallel"]
# rayon-parallel tracing. Off for wasm32 (no threads) — the reference then runs
# serially, which is fine for the on-idle "numbers come from the reference" path.
parallel = ["dep:rayon"]
# The f64 full-3D reference tracer (PR 3D-04). Implies the 3D scene model, since
# there is nothing to trace without one. Off by default: while it is incomplete
# it must not be reachable from anything that displays a number.
trace3 = ["oc-core/scene3"]

[dependencies]
oc-core.workspace = true
glam.workspace = true
rayon = { workspace = true, optional = true }
# A block of a split reference trace carries its capability report to the
# worker that adds the blocks up as JSON (`TracePart3::encode`).
serde.workspace = true
serde_json.workspace = true

# CV-A: the headless Scene3 trace runner (§16). Needs the 3D reference tracer, so
# it is skipped by a default `cargo build`; run with `--features trace3`.
[[example]]
name = "scene3_trace"
required-features = ["trace3"]

# The heliostat light-pipe demonstrator: builds, traces and writes the scene.
[[example]]
name = "heliostat_lightpipe"
required-features = ["trace3"]

[[example]]
name = "heliostat_melt"
required-features = ["trace3"]
