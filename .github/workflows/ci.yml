name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Artifact builds from a branch (kernel bumps are cut from feature branches
  # while the repo stays private — no registry to publish to yet).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # oc-py is a PyO3 crate exercised in the `python-bridge` job below; keep it
      # out of the pure-Rust job so this stays Python-free and fast.
      - name: clippy
        run: cargo clippy --workspace --exclude oc-py --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude oc-py
      # The 3D scene model, geometry, and tracer live behind off-by-default
      # feature flags so the shipped engine stays 2D (canonical-3d-kernel.md).
      # The step above therefore runs the gated suites as zero tests; this one
      # turns the flags on so the 3D code is actually linted and exercised. It is
      # scoped to the crates each flag reaches, not the whole workspace, so a
      # crate that never opts in is not asked for a feature it does not have.
      - name: clippy (3D features)
        run: cargo clippy -p oc-core --features scene3 --all-targets -- -D warnings
      - name: test (3D features)
        run: cargo test -p oc-core --features scene3
      # `trace3` implies `oc-core/scene3`, so this also covers the geometry as the
      # tracer consumes it.
      - name: clippy (3D tracer)
        run: cargo clippy -p oc-trace --features trace3 --all-targets -- -D warnings
      - name: test (3D tracer)
        run: cargo test -p oc-trace --features trace3

  python-bridge:
    name: python bridge (optiland round-trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clippy (oc-py)
        run: cargo clippy -p oc-py --all-targets -- -D warnings
      - name: build + install (maturin backend) with test deps
        working-directory: crates/oc-py
        run: pip install '.[test]'
      - name: pytest (.ocanvas ⇄ Optiland Optic round-trip)
        working-directory: crates/oc-py
        run: pytest tests -q

  web:
    name: web build (wasm + typecheck + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: build
        working-directory: web
        run: npm run build
      # CV-B artifact (integration spec §18.7): pack the wasm-pack output into a
      # commit-stamped npm tarball. A maintainer copies it into the configurator's
      # vendor/ (rule 13); the `+<sha>` build metadata is the version pin. This
      # mechanism retires under ADR-12/ADR-8 (registry publish once public).
      - name: pack kernel tarball (CV-B)
        working-directory: web/pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short=9 HEAD)
          npm pkg set version="${VERSION}+${SHA}"
          FILE=$(npm pack --silent | tail -n1)
          TARGET="oc-wasm-${VERSION}+${SHA}.tgz"
          [ "$FILE" = "$TARGET" ] || mv "$FILE" "$TARGET"
          echo "packed $TARGET"
      - name: upload kernel tarball
        uses: actions/upload-artifact@v4
        with:
          name: oc-wasm-tarball
          path: web/pkg/oc-wasm-*.tgz
          retention-days: 30
      - name: install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      # The openUC2 route driven the way a user drives it (§19.5). Playwright
      # serves the build above; nothing here reaches into the wasm handle.
      - name: browser tests
        working-directory: web
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # The oc-py kernel wheel, stamped like the CV-B tarball: the version's
  # +<sha9> build metadata is the kernel commit, so a consumer vendoring both
  # packagings can hold the browser and the backend kernel to ONE stamp
  # (optikit-v2's CI checks exactly that). Retires with ADR-12 (PyPI publish
  # once public), same as the tarball's npm route.
  kernel-wheel:
    name: kernel wheel (oc-py, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: stamp wheel version with the kernel commit
        shell: bash
        run: |
          SHA=$(git rev-parse --short=9 HEAD)
          # `-i.bak`, not a bare `-i`: BSD sed (macOS) reads the NEXT argument
          # as the backup suffix, so `-i -E` swallows the `-E`, falls back to
          # BRE, and dies on the undefined \1. The suffixed form is the one
          # spelling GNU and BSD both accept.
          sed -i.bak -E "s/^version = \"([0-9][^\"+]*)\"/version = \"\1+${SHA}\"/" crates/oc-py/pyproject.toml
          rm -f crates/oc-py/pyproject.toml.bak
          # The stamp IS the contract: an unstamped wheel would install happily
          # and quietly break a consumer's one-commit pin. Fail here instead.
          grep -q "^version = \".*+${SHA}\"$" crates/oc-py/pyproject.toml
          grep '^version' crates/oc-py/pyproject.toml
      - name: build abi3 wheel
        working-directory: crates/oc-py
        run: |
          pip install maturin
          maturin build --release --out dist
      - name: upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: oc-py-wheel-${{ matrix.os }}
          path: crates/oc-py/dist/*.whl
          retention-days: 30
